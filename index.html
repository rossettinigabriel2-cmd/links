<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prospecção Direct Instagram - Supabase</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK oficial do Supabase via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Cabeçalho -->
    <header class="text-center space-y-2">
      <h1 class="text-3xl font-bold text-indigo-400">Prospecção no Instagram</h1>
      <p class="text-slate-400">Gerenciador de Leads integrado ao Supabase</p>
    </header>

    <!-- Configuração da Mensagem Padrão -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-3">
      <h2 class="text-lg font-semibold text-slate-200">1. Mensagem de Abordagem Padrão</h2>
      <textarea id="mensagemPadrao" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Digite a mensagem de abordagem..."></textarea>
      <p class="text-xs text-slate-400">* A página copia automaticamente a mensagem antes de abrir o perfil para você colar (<kbd class="bg-slate-700 px-1 rounded">Ctrl + V</kbd>).</p>
    </div>

    <!-- Formulário de Cadastro -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
      <h2 class="text-lg font-semibold text-slate-200">2. Cadastrar Novo Lead</h2>
      
      <form id="leadForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Nome / Perfil</label>
          <input type="text" id="nome" required placeholder="Ex: João da Silva" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">@ do Instagram ou Link</label>
          <input type="text" id="instagramInput" required placeholder="Ex: @usuario ou instagram.com/usuario" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500">
        </div>

        <button type="submit" id="btnSalvar" class="md:col-span-2 bg-indigo-600 hover:bg-indigo-500 font-semibold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2">
          <span>Cadastrar Lead no Supabase</span>
        </button>
      </form>
    </div>

    <!-- Lista de Leads -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-200">3. Lista de Prospectados</h2>
        <span id="totalLeads" class="text-xs bg-slate-700 px-2.5 py-1 rounded-full text-slate-300">Carregando...</span>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="border-b border-slate-700 text-xs text-slate-400 uppercase">
              <th class="py-3 px-2">Nome</th>
              <th class="py-3 px-2">Instagram</th>
              <th class="py-3 px-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody id="tabelaLeads" class="divide-y divide-slate-700/50 text-sm">
            <!-- Dados do Supabase serão renderizados aqui -->
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // Configurações do Supabase (Substitua pelas suas credenciais)
    const SUPABASE_URL = 'hhttps://uqqnmmixurjyzgctpici.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Mzo-Ab52kx0Up_s_9CpM9Q_MA8JbYwl';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const msgPadraoEl = document.getElementById('mensagemPadrao');

    // Carrega mensagem padrão do LocalStorage (preferência local rápida)
    msgPadraoEl.value = localStorage.getItem('msg_padrao_ig') || "Olá! Notei seu perfil e gostaria de apresentar uma oportunidade...";
    msgPadraoEl.addEventListener('input', () => {
      localStorage.setItem('msg_padrao_ig', msgPadraoEl.value);
    });

    // Função para sanitizar e obter apenas o username
    function extrairUsername(input) {
      let cleaned = input.trim().replace('@', '');
      if (cleaned.includes('instagram.com/')) {
        cleaned = cleaned.split('instagram.com/')[1].split('/')[0].split('?')[0];
      }
      return cleaned;
    }

    // Carregar leads do Supabase
    async function carregarLeads() {
      const tbody = document.getElementById('tabelaLeads');
      const total = document.getElementById('totalLeads');

      const { data: leads, error } = await _supabase
        .from('leads')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Erro ao buscar leads:', error);
        tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-red-400">Erro ao carregar dados do Supabase. Verifique a API Key.</td></tr>`;
        return;
      }

      tbody.innerHTML = '';
      total.innerText = `${leads.length} leads`;

      if (leads.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-500">Nenhum lead cadastrado ainda.</td></tr>`;
        return;
      }

      leads.forEach(lead => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-slate-800/50 transition-colors';
        tr.innerHTML = `
          <td class="py-3 px-2 font-medium">${lead.nome}</td>
          <td class="py-3 px-2 text-indigo-400">@${lead.username}</td>
          <td class="py-3 px-2 text-right space-x-2">
            <button onclick="abordarDirect('${lead.username}')" class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white px-3 py-1.5 rounded-md text-xs font-semibold shadow">
              Enviar Direct
            </button>
            <button onclick="removerLead(${lead.id})" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1">
              Excluir
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Cadastrar novo lead no Supabase
    document.getElementById('leadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('nome').value;
      const rawIg = document.getElementById('instagramInput').value;
      const username = extrairUsername(rawIg);

      if (!username) return alert('Por favor, insira um perfil válido.');

      const { error } = await _supabase
        .from('leads')
        .insert([{ nome, username }]);

      if (error) {
        alert('Erro ao salvar no Supabase: ' + error.message);
        return;
      }

      document.getElementById('leadForm').reset();
      carregarLeads();
    });

    // Remover lead no Supabase
    async function removerLead(id) {
      if (!confirm('Deseja realmente remover este lead?')) return;

      const { error } = await _supabase
        .from('leads')
        .delete()
        .eq('id', id);

      if (error) {
        alert('Erro ao excluir: ' + error.message);
        return;
      }

      carregarLeads();
    }

    // Abrir direct e copiar mensagem
    async function abordarDirect(username) {
      const texto = msgPadraoEl.value;
      
      try {
        await navigator.clipboard.writeText(texto);
      } catch (err) {
        console.error('Erro ao copiar:', err);
      }

      window.open(`https://www.instagram.com/${username}/`, '_blank');
    }

    // Inicializa a listagem
    carregarLeads();
  </script>
</body>
</html>
